- id: update
  execute-command: make predeploy
  command-working-directory: /home/ubuntu/care-plan
  pass-environment-to-command:
    - source: 'string'
      name: 'DOCKER_COMPOSE'
      value: 'docker-compose'
  trigger-rule:
    and:
      - match:
          type: payload-hash-sha1
          secret: '5*Jc%YK5!sn^S67N'
          parameter:
            source: header
            name: X-Hub-Signature
      - match:
          type: value
          value: refs/heads/PCP-257-config-deploiement-predploy
          parameter:
            source: payload
            name: ref
