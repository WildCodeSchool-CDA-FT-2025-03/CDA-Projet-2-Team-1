- id: update
  execute-command: deploy
  command-working-directory: /opt
  pass-environment-to-command:
    - source: 'string'
      name: 'DOCKER_COMPOSE'
      value: 'docker-compose'
    - source: 'string'
      name: 'BRANCH'
      value: 'predeploy'
    - source: 'string'
      name: 'CMD_RUN'
      value: 'predeploy'
  trigger-rule:
    and:
      - match:
          type: payload-hash-sha1
          secret: 'password'
          parameter:
            source: header
            name: X-Hub-Signature
      - match:
          type: value
          value: refs/heads/predeploy
          parameter:
            source: payload
            name: ref
