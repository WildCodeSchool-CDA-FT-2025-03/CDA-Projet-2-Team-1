name: Test integration

on:
  pull_request:
    branches: [dev, predeploy]

jobs:
  test-integration:
    name: Test integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: action/checkout@v4

      - name: Setup Docker
        uses: docker/setup-docker-action@v4

      - name: Run test
        run: make test
